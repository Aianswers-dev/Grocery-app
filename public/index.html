<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trolley</title>
    <meta name="description" content="Your grocery list, priced at Woolworths, Coles and ALDI — with the cheapest pick for every item." />
    <meta name="theme-color" content="#f6f4ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trolley" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = JSON.parse(localStorage.getItem('grocery.v1') || '{}')?.settings?.theme;
        if (t === 'light' || t === 'dark') Object.assign(document.documentElement.dataset, { theme: t, themeByApp: '1' });
      } catch {}
    </script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="app-head">
        <span class="logo" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>Trolley<span id="demo-badge"></span></h1>
          <p id="meta" class="meta">Woolworths · Coles · ALDI</p>
        </div>
        <button id="refresh" class="icon-btn" data-action="refresh" aria-label="Refresh prices"></button>
        <button id="settings-btn" class="icon-btn" data-action="open-settings" aria-label="Settings"></button>
      </header>

      <div id="hero-slot"></div>

      <div class="composer-wrap">
        <form id="add-form" class="composer" autocomplete="off">
          <span id="composer-icon" class="lead-emoji" aria-hidden="true">🛒</span>
          <input id="add-input" type="text" placeholder="Add milk 2L, 6 bananas…" aria-label="Add an item" enterkeyhint="done" autocapitalize="none" autocorrect="off" spellcheck="false" />
          <button id="add-btn" class="add-btn" aria-label="Add item"></button>
        </form>
        <div id="suggest" class="suggest" hidden></div>
      </div>

      <main id="main"></main>
    </div>

    <button id="float-total" class="float-total" data-action="open-summary" aria-label="Open basket" tabindex="-1"></button>
    <dialog id="sheet" class="sheet" aria-label="Details"><div id="sheet-body" class="sheet-body" tabindex="-1"></div></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
